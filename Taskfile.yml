version: "3"

tasks:
  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and open HTML report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
    generates:
      - coverage.out
      - coverage.html

  fuzz:
    desc: Run fuzz tests (default 30s, override with FUZZTIME)
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - go test -race -fuzz=. -fuzztime={{.FUZZTIME}} ./internal/page/

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
