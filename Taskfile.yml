version: "3"

tasks:
  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -count=1 ./...

  test:dst:
    desc: Deterministic-simulation suite (requires the godst fork toolchain; docs/specs/dst-testing.md)
    cmds:
      - godst test -tags dst -count=1 -timeout 600s ./dsttest/

  test:dst:race:
    desc: Exploration tier under the dst-race build — DPOR with the dependency instrumentation active (docs/specs/dst-testing.md §Exploration tier)
    cmds:
      - godst test -race -tags dst -count=1 -timeout 1800s -run 'TestSimulationExplore|TestSimulationPCT' ./dsttest/

  cover:
    desc: Run tests with coverage and open HTML report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
    generates:
      - coverage.out
      - coverage.html

  fuzz:
    desc: Run each fuzz target for FUZZTIME (default 30s). Go fuzzes one target per run, so iterate.
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - for t in $(go test -list='^Fuzz' ./internal/page/ | grep '^Fuzz'); do echo "=== fuzz $t ==="; go test -race -run='^$' -fuzz="^$t$" -fuzztime={{.FUZZTIME}} ./internal/page/ || exit 1; done

  bench:
    desc: Run benchmarks (override BENCH=pattern, BENCHTIME=200ms)
    vars:
      BENCH: '{{.BENCH | default "."}}'
      BENCHTIME: '{{.BENCHTIME | default "1s"}}'
    cmds:
      - go test -run='^$' -bench={{.BENCH}} -benchmem -benchtime={{.BENCHTIME}} ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
