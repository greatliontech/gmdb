version: "3"

tasks:
  test:
    desc: Run all tests with race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Run tests with coverage and open HTML report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out
      - go tool cover -html=coverage.out -o coverage.html
    generates:
      - coverage.out
      - coverage.html

  fuzz:
    desc: Run each fuzz target for FUZZTIME (default 30s). Go fuzzes one target per run, so iterate.
    vars:
      FUZZTIME: '{{.FUZZTIME | default "30s"}}'
    cmds:
      - for t in $(go test -list='^Fuzz' ./internal/page/ | grep '^Fuzz'); do echo "=== fuzz $t ==="; go test -race -run='^$' -fuzz="^$t$" -fuzztime={{.FUZZTIME}} ./internal/page/ || exit 1; done

  bench:
    desc: Run benchmarks (override BENCH=pattern, BENCHTIME=200ms)
    vars:
      BENCH: '{{.BENCH | default "."}}'
      BENCHTIME: '{{.BENCHTIME | default "1s"}}'
    cmds:
      - go test -run='^$' -bench={{.BENCH}} -benchmem -benchtime={{.BENCHTIME}} ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...
